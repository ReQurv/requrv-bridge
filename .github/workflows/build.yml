name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Export Apple signing env vars
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Export only the vars that are actually set, so the Tauri CLI
          # degrades to an unsigned build when no Apple secrets exist yet.
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_CERTIFICATE=${APPLE_CERTIFICATE}" >> "$GITHUB_ENV"
          fi
          if [ -n "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "APPLE_CERTIFICATE_PASSWORD=${APPLE_CERTIFICATE_PASSWORD}" >> "$GITHUB_ENV"
          fi
          if [ -n "$APPLE_ID" ]; then
            echo "APPLE_ID=${APPLE_ID}" >> "$GITHUB_ENV"
          fi
          if [ -n "$APPLE_PASSWORD" ]; then
            echo "APPLE_PASSWORD=${APPLE_PASSWORD}" >> "$GITHUB_ENV"
          fi
          if [ -n "$APPLE_TEAM_ID" ]; then
            echo "APPLE_TEAM_ID=${APPLE_TEAM_ID}" >> "$GITHUB_ENV"
          fi

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun run tauri
          tagName: v__VERSION__
          releaseName: v__VERSION__

      - name: Strip version from release asset names
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          VER="$(jq -r '.version' src-tauri/tauri.conf.json)"
          TAG="v${VER}"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          for old in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
            new="$(printf '%s' "$old" | sed -E "s/_${VER}_/_/; s/_x64_[a-z]{2}-[A-Z]{2}\.msi$/_x64.msi/; s/^ReQurv\.Bridge-.*\.x86_64\.rpm$/ReQurv.Bridge_x86_64.rpm/")"
            if [ "$old" != "$new" ]; then
              echo "Renaming ${old} -> ${new}"
              gh release download "$TAG" --pattern "$old" --dir "$TMP" --clobber
              mv "$TMP/$old" "$TMP/$new"
              gh release delete-asset "$TAG" "$old"
              gh release upload "$TAG" "$TMP/$new" --clobber
            fi
          done
